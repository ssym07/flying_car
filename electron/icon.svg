<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 100 824 824" width="1024" height="1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2a6e"/><stop offset="0.55" stop-color="#c46aa8"/><stop offset="1" stop-color="#ffb38a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9d3ea"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6fa8"/><stop offset="1" stop-color="#0e2440"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#66ccff" stop-opacity="0"/><stop offset="1" stop-color="#66ccff" stop-opacity="0.9"/>
    </linearGradient>
    <clipPath id="clip"><rect x="100" y="100" width="824" height="824"/></clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>
  <g clip-path="url(#clip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sky)"/>
    <circle cx="700" cy="560" r="120" fill="#ffd9a8" opacity="0.55"/>
    <!-- ビル -->
    <g fill="#24183f">
      <rect x="100" y="700" width="90" height="230"/><rect x="180" y="640" width="70" height="290"/><rect x="245" y="720" width="80" height="210"/>
      <rect x="320" y="590" width="64" height="340"/><rect x="380" y="680" width="100" height="250"/><rect x="475" y="620" width="60" height="310"/>
      <rect x="530" y="730" width="90" height="200"/><rect x="615" y="660" width="70" height="270"/><rect x="680" y="560" width="56" height="370"/>
      <rect x="730" y="700" width="96" height="230"/><rect x="820" y="650" width="110" height="280"/>
    </g>
    <g fill="#ffcf7a" opacity="0.8">
      <rect x="335" y="620" width="10" height="14"/><rect x="360" y="660" width="10" height="14"/><rect x="335" y="700" width="10" height="14"/>
      <rect x="695" y="600" width="10" height="14"/><rect x="715" y="650" width="10" height="14"/><rect x="200" y="680" width="10" height="14"/>
      <rect x="495" y="660" width="10" height="14"/><rect x="845" y="690" width="10" height="14"/><rect x="630" y="700" width="10" height="14"/>
    </g>
    <!-- 光の筋 -->
    <rect x="100" y="452" width="330" height="10" rx="5" fill="url(#trail)"/>
    <rect x="140" y="500" width="280" height="8" rx="4" fill="url(#trail)" opacity="0.7"/>
    <!-- 車 -->
    <g filter="url(#shadow)" transform="rotate(-8 600 470)">
      <ellipse cx="600" cy="540" rx="200" ry="22" fill="#66ccff" filter="url(#glow)" opacity="0.9"/>
      <path d="M400 500 Q400 430 470 420 L520 380 Q560 350 640 350 Q720 350 760 400 L790 420 Q820 430 820 480 Q820 530 780 535 L440 535 Q400 535 400 500 Z" fill="url(#body)"/>
      <path d="M535 395 Q570 368 640 368 Q705 368 735 405 L745 425 L520 425 Z" fill="url(#glass)"/>
      <rect x="420" y="470" width="80" height="12" rx="6" fill="#ff4d5e"/>
      <path d="M440 535 L780 535" stroke="#66ccff" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>
</svg>
